    mobileDrawer.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => setDrawer(false));

    const applyTheme = (isDark) => {
      document.documentElement.classList.toggle('dark', isDark);

  let ticking = false;

  const onScroll = () => {
    const scrollTop = window.scrollY || document.documentElement.scrollTop;
    if (navPill) navPill.style.setProperty('--nav-p', Math.min(scrollTop / 200, 1).toFixed(3));

    ticking = false;
  };

  window.addEventListener('scroll', () => {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(onScroll);
    }
  }, { passive: true });
  onScroll();
</script>




<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  AOS.init({
    duration: 800,
    once: true,
    offset: 50,
    easing: 'ease-out-cubic',
    // AOS holds off-screen elements at translate3d(+/-100px, 0, 0) until they
    // scroll into view, which pushes them past the viewport edge on phones and
    // creates a horizontal scrollbar. Off below md; the content is visible anyway.
    disable: () => window.matchMedia('(max-width: 767px)').matches
  });
  AOS.refreshHard();
</script>
